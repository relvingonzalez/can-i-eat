name: Refresh chain menus

# Re-scrapes official allergen pages weekly and commits src/assets/data/chains.json if anything changed.
# Vercel redeploys automatically on the push. Free on GitHub Actions.
on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run data:scrape

      - name: Commit changes
        run: |
          if git diff --quiet -- src/assets/data/chains.json; then
            echo "No menu changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/data/chains.json
          git commit -m "Refresh chain menus"
          git push
